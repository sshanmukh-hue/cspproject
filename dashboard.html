<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - ElderSafe</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="phone"><div class="screen">
<div class="card-row between mb">
<div><p class="hello">Hello, <span id="userName">Friend</span> 👋</p><p class="small">Stay safe, always!</p></div>
<a href="settings.html" class="gear">⚙️</a></div>

<div class="card green-card"><div class="card-row between"><div><p class="card-sub">Fall Detection</p><p id="fallStatusText" class="big-green">ON</p></div>
<label class="switch"><input type="checkbox" id="fallToggle" onchange="toggleFallDetection()"><span class="slider"></span></label></div></div>

<div class="two-col"><div class="card"><p class="card-sub">📍 GPS</p><p class="card-title green">Active</p></div>
<div class="card"><p class="card-sub">🔋 Battery</p><p class="card-title" id="batteryText">--%</p></div></div>

<div class="card"><p class="card-sub">Emergency Contact</p><div class="card-row between">
<div><p class="card-title" id="contactName">Not set</p><p class="small" id="contactPhone"></p></div>
<a href="contact.html" class="arrow">›</a></div></div>

<button class="sos-btn" onclick="sendManualSOS()">🆘 SOS<span>Tap for help</span></button>
<p class="center small">Press SOS to send an emergency alert.</p>
<button class="btn btn-outline" onclick="location.href='fall-detected.html'">⚠️ Simulate Fall Detected</button>
</div>
<nav class="bottom-nav"><a class="active" href="dashboard.html">🏠<span>Home</span></a><a href="location.html">📍<span>Location</span></a><a href="history.html">🕐<span>History</span></a><a href="settings.html">⚙️<span>Settings</span></a></nav>
</div>
<script src="js/app.js"></script><script>
requireAuth();
const u=getCurrentUser(); if(u) userName.textContent=u.name.split(" ")[0];
const s=getSettings(); fallToggle.checked=s.fallDetection; updateFallText(s.fallDetection);
function updateFallText(on){fallStatusText.textContent=on?"ON":"OFF";fallStatusText.className=on?"big-green":"big-muted";}
function toggleFallDetection(){const s=getSettings();s.fallDetection=fallToggle.checked;saveSettings(s);updateFallText(s.fallDetection);}
const c=getContact();if(c){contactName.textContent=c.name;contactPhone.textContent=c.phone||"";}
if(navigator.getBattery){navigator.getBattery().then(b=>batteryText.textContent=Math.round(b.level*100)+"%").catch(()=>batteryText.textContent="--%");}
else batteryText.textContent="--%";
</script></body></html>
