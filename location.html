<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Location - ElderSafe</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="phone"><div class="topbar"><a href="dashboard.html" class="back-btn">←</a><h1>My Location</h1></div>
<div class="screen center"><div class="location-icon">📍</div><h2>Current Location</h2><p id="locText" class="small">Getting location...</p><button class="btn btn-primary" onclick="getLocation()">Refresh Location</button><button class="btn btn-outline mt" onclick="openMap()">Open Map</button></div>
<nav class="bottom-nav"><a href="dashboard.html">🏠<span>Home</span></a><a class="active" href="location.html">📍<span>Location</span></a><a href="history.html">🕐<span>History</span></a><a href="settings.html">⚙️<span>Settings</span></a></nav></div>
<script src="js/app.js"></script><script>requireAuth();let coords=null;function getLocation(){if(!navigator.geolocation){locText.textContent="GPS is not supported.";return;}locText.textContent="Getting location...";navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lon:p.coords.longitude};locText.textContent=coords.lat.toFixed(6)+", "+coords.lon.toFixed(6);localStorage.setItem("elderSafeLocation",JSON.stringify(coords));},()=>locText.textContent="Unable to get location. Please allow GPS permission.");}function openMap(){if(!coords){alert("Get your location first.");return;}window.open("https://www.google.com/maps?q="+coords.lat+","+coords.lon,"_blank");}getLocation();</script></body></html>
